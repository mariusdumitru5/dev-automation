apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: frontend-assets
    files:
      - ../frontend/index.html
      - ../frontend/style.css
      - ../frontend/index.js
      - ../frontend/default.conf
     
# Risorse da applicare
resources:
  - 01-frontend-deployment.yaml
  - 02-redis-statefulset.yaml