apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx-frontend
        image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
        resources:
          limits:
            memory: "200Mi"
            cpu: "200m"
          requests:
            memory: "100Mi"
            cpu: "100m"
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts: 
          - name: frontend-volume 
            mountPath: /etc/nginx/conf.d/default.conf 
            subPath: default.conf
          - name: frontend-volume 
            mountPath: /usr/share/nginx/html/index.html
            subPath: index.html
          - name: frontend-volume 
            mountPath: /usr/share/nginx/html/index.js
            subPath: index.js
          - name: frontend-volume 
            mountPath: /usr/share/nginx/html/style.css
            subPath: style.css
      volumes:
        - name: frontend-volume
          configMap: 
            name: frontend-assets

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080
